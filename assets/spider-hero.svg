<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Spider-Man inspired profile banner</title>
  <desc id="desc">A premium dark navy banner with deep red panels, subtle blue highlights, comic accents, and web line details.</desc>
  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1200" y2="340">
      <stop stop-color="#050A14"/>
      <stop offset="0.48" stop-color="#081426"/>
      <stop offset="1" stop-color="#1A0710"/>
    </linearGradient>
    <linearGradient id="redSlash" x1="228" y1="0" x2="982" y2="340">
      <stop stop-color="#E62429" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#7F1020" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sense { animation: pulse 3.8s ease-in-out infinite; transform-origin: center; }
      .web { stroke-dasharray: 7 12; animation: crawl 18s linear infinite; }
      .scan { animation: drift 9s ease-in-out infinite alternate; }
      @keyframes pulse { 0%,100%{opacity:.38} 50%{opacity:.9} }
      @keyframes crawl { to { stroke-dashoffset: -190; } }
      @keyframes drift { to { transform: translateX(26px); opacity:.74; } }`n      svg:hover .scan { transform: translateX(18px); opacity: .92; }`n      svg:hover .sense { opacity: .95; }
    </style>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#heroGrad)"/>
  <ellipse cx="930" cy="72" rx="270" ry="120" fill="url(#blueGlow)" class="sense"/>
  <ellipse cx="230" cy="304" rx="240" ry="90" fill="#E62429" opacity="0.11"/>
  <path d="M285 0H793L915 340H407L285 0Z" fill="url(#redSlash)" opacity="0.36"/>
  <path d="M333 0H379L501 340H455L333 0Z" fill="#F8FAFC" opacity="0.06"/>
  <path d="M789 0H835L957 340H911L789 0Z" fill="#38BDF8" opacity="0.08"/>

  <g opacity="0.34" stroke="#94A3B8" stroke-width="1">
    <path class="web" d="M0 42C122 103 207 167 270 250C337 187 421 122 555 54C680 119 776 185 846 267C935 178 1051 109 1200 54"/>
    <path class="web" d="M0 103C138 137 237 188 329 276C393 212 473 151 603 84C717 151 810 213 892 292C968 216 1071 151 1200 115"/>
    <path class="web" d="M71 0C143 80 203 170 252 340"/>
    <path class="web" d="M1129 0C1048 84 989 183 948 340"/>
    <path class="web" d="M600 0C588 116 589 226 603 340"/>
  </g>

  <g class="scan" opacity="0.62">
    <path d="M75 250H310" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M890 92H1118" stroke="#E62429" stroke-width="2" stroke-linecap="round"/>
    <path d="M934 111H1072" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g filter="url(#softGlow)">
    <text x="600" y="136" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="1.5">LAGGOUNE HABIBALLAH</text>
    <text x="600" y="184" text-anchor="middle" fill="#38BDF8" font-family="Fira Code, Consolas, monospace" font-size="19" font-weight="700">FULL-STACK DEVELOPER // SOFTWARE ENGINEERING STUDENT</text>
  </g>
  <path d="M436 214H764" stroke="#E62429" stroke-width="4" stroke-linecap="round"/>
  <path d="M489 229H711" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>

