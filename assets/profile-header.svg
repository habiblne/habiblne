    <text x="600" y="148" fill="#C9D1D9" font-size="20" font-weight="500">Software Engineering Student · Full-Stack Developer</text>
    <text x="600" y="191" fill="#8B949E" font-size="15" font-family="Fira Code, Consolas, monospace">JavaScript · Python · React · Node.js · Django · MySQL</text>
